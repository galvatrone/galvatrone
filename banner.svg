<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Mihail Charilaou — Software Engineering, AI Systems, Low-Level Programming</title>
  <desc id="desc">Animated dark engineering banner with gently pulsing network nodes, scrolling signal and terminal caret.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101f"/><stop offset="0.55" stop-color="#0b1528"/><stop offset="1" stop-color="#11102a"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset="0.58" stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8" stop-opacity="0"/><stop offset="0.5" stop-color="#38bdf8" stop-opacity=".34"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#41537a" stroke-opacity=".15" stroke-width="1"/></pattern>
    <clipPath id="clip"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>
  <style>
    .pulse{animation:pulse 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .pulse2{animation:pulse 3.2s ease-in-out 1.1s infinite;transform-box:fill-box;transform-origin:center}
    .flow{stroke-dasharray:5 12;animation:flow 5s linear infinite}
    .caret{animation:blink 1.05s steps(1,end) infinite}
    .scan{animation:scan 9s ease-in-out infinite}
    .float{animation:float 7s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.38;transform:scale(.85)}50%{opacity:1;transform:scale(1.22)}}
    @keyframes flow{to{stroke-dashoffset:-136}}
    @keyframes blink{50%{opacity:0}}
    @keyframes scan{0%{transform:translateX(-400px);opacity:0}15%{opacity:1}75%{opacity:1}100%{transform:translateX(1440px);opacity:0}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @media (prefers-reduced-motion:reduce){.pulse,.pulse2,.flow,.caret,.scan,.float{animation:none}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="400" height="320" fill="url(#shine)" opacity=".4" class="scan"/>
    <path d="M0 70H270L312 112H430 M880 42H1040L1115 117H1200 M0 256H250L290 220H390 M822 290H1008L1050 245H1200" stroke="#3992c4" stroke-opacity=".36" stroke-width="1.5" fill="none"/>
    <path d="M0 78H270L312 120H430 M880 50H1037L1110 125H1200" stroke="#67e8f9" stroke-opacity=".42" stroke-width="2" fill="none" class="flow"/>
    <g stroke="#6479ad" stroke-opacity=".40" fill="none" stroke-width="1.2">
      <path d="M60 150L116 111L172 164L118 220L60 150M116 111L200 95L240 157L172 164L200 95M172 164L238 216L118 220M240 157L290 178L238 216"/>
      <path d="M965 170L1013 109L1078 134L1123 198L1055 246L965 170L1078 134L1055 246L1013 109L1123 198"/>
    </g>
    <g fill="#60a5fa">
      <circle cx="60" cy="150" r="4" class="pulse"/><circle cx="116" cy="111" r="4" class="pulse2"/>
      <circle cx="172" cy="164" r="5" class="pulse"/><circle cx="118" cy="220" r="4" class="pulse2"/>
      <circle cx="200" cy="95" r="3.5" class="pulse2"/><circle cx="240" cy="157" r="4" class="pulse"/><circle cx="238" cy="216" r="4" class="pulse2"/><circle cx="290" cy="178" r="3" class="pulse"/>
      <circle cx="965" cy="170" r="4" class="pulse2"/><circle cx="1013" cy="109" r="4" class="pulse"/><circle cx="1078" cy="134" r="5" class="pulse2"/><circle cx="1123" cy="198" r="4" class="pulse"/><circle cx="1055" cy="246" r="4" class="pulse2"/>
    </g>
    <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" fill="#587aa3" font-size="13" opacity=".9">
      <text x="42" y="34">// build · test · iterate</text><text x="932" y="33">NETWORK STATUS</text>
      <text x="970" y="298">[ connected ]</text>
    </g>
    <g class="float">
      <rect x="334" y="66" width="532" height="187" rx="14" fill="#0a1224" fill-opacity=".78" stroke="#486796" stroke-opacity=".48"/>
      <path d="M334 104H866" stroke="#486796" stroke-opacity=".4"/>
      <circle cx="356" cy="86" r="4" fill="#fb7185"/><circle cx="371" cy="86" r="4" fill="#fbbf24"/><circle cx="386" cy="86" r="4" fill="#4ade80"/>
      <text x="410" y="90" font-size="11" font-family="ui-monospace,Consolas,monospace" fill="#94a3b8">galvatrone / engineer</text>
      <text x="600" y="151" font-family="DejaVu Sans,Arial,sans-serif" font-size="43" font-weight="700" fill="#f8fafc" text-anchor="middle">Mihail <tspan fill="url(#accent)">Charilaou</tspan></text>
      <text x="600" y="184" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">SOFTWARE ENGINEERING  ·  AI SYSTEMS  ·  LOW-LEVEL PROGRAMMING</text>
      <rect x="424" y="202" width="352" height="33" rx="16" fill="#14243c" stroke="#47638c" stroke-opacity=".8"/>
      <text x="600" y="223" font-family="ui-monospace,Consolas,monospace" font-size="15" fill="#bae6fd" text-anchor="middle">C++  /  Rust  /  Python  /  Linux</text>
    </g>
    <text x="44" y="294" font-family="ui-monospace,Consolas,monospace" font-size="14" fill="#7dd3fc">&gt;_ <tspan fill="#94a3b8">always learning</tspan><tspan class="caret" fill="#38bdf8"> ▌</tspan></text>
    <rect x="1" y="1" width="1198" height="318" rx="19" fill="none" stroke="#41618a" stroke-opacity=".5" stroke-width="2"/>
  </g>
</svg>
